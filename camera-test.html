<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست دوربین ساده</title>
    <style>
        body { background: #000; color: #0f0; text-align: center; padding: 20px; font-family: monospace; }
        button { background: #9b59b6; color: white; padding: 15px 30px; font-size: 18px; border: none; border-radius: 10px; margin: 20px; }
        video { width: 100%; max-width: 400px; margin: 20px auto; border: 2px solid #9b59b6; display: none; }
        #log { background: #222; padding: 10px; border-radius: 10px; margin: 20px; word-break: break-all; }
    </style>
</head>
<body>
    <h1>📷 تست دوربین</h1>
    <button id="btn">شروع دوربین</button>
    <video id="video" autoplay playsinline muted></video>
    <div id="log">✅ آماده - دکمه را بزنید</div>

    <script>
        const btn = document.getElementById('btn');
        const video = document.getElementById('video');
        const logDiv = document.getElementById('log');
        
        function log(msg, isError = false) {
            logDiv.innerHTML = msg;
            logDiv.style.color = isError ? '#ff8888' : '#88ff88';
            console.log(msg);
        }
        
        btn.onclick = async function() {
            log('🔍 درخواست دسترسی به دوربین...');
            
            try {
                // بررسی وجود mediaDevices
                if (!navigator.mediaDevices) {
                    throw new Error('navigator.mediaDevices وجود ندارد!');
                }
                
                if (!navigator.mediaDevices.getUserMedia) {
                    throw new Error('getUserMedia پشتیبانی نمی‌شود!');
                }
                
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.style.display = 'block';
                log('✅ دوربین کار می‌کند!');
                btn.style.display = 'none';
                
            } catch(err) {
                log('❌ خطا: ' + err.message, true);
            }
        };
    </script>
</body>
</html>
