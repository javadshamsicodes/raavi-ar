<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RAAVI AR Museum</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        h1 { color: white; font-size: 28px; margin: 20px; }
        p { color: #aaa; margin: 10px 20px; line-height: 1.5; }
        
        #startBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 20px;
            border-radius: 50px;
            margin: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        
        #status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            z-index: 100;
            font-family: monospace;
        }
        
        .error { color: #ff8888 !important; }
        .hidden { display: none !important; }
        
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #overlayVideo {
            z-index: 20;
            object-fit: contain;
            background: rgba(0,0,0,0.8);
            display: none;
        }
    </style>
</head>
<body>

    <div id="startScreen">
        <div style="font-size: 80px;">🎯</div>
        <h1>RAAVI واقعیت افزوده</h1>
        <p>دوربین را به سمت نشانه بگیرید</p>
        <button id="startBtn">شروع تجربه AR</button>
        <p style="font-size: 12px; color: #666; margin-top: 20px;">پس از کلیک، اجازه دسترسی به دوربین را بدهید</p>
    </div>

    <div id="status">✅ آماده - دکمه را بزنید</div>

    <video id="camera" autoplay playsinline muted></video>
    <video id="overlayVideo" src="Raavi_AR-final2.webm" loop muted playsinline></video>

    <script>
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');
        const cameraVideo = document.getElementById('camera');
        const overlayVideo = document.getElementById('overlayVideo');
        
        let cameraStream = null;
        let isPlaying = false;
        
        function setStatus(msg, isError = false) {
            statusDiv.innerHTML = msg;
            statusDiv.style.color = isError ? '#ff8888' : '#88ff88';
            console.log(msg);
        }
        
        async function startCamera() {
            setStatus('📱 درخواست دسترسی به دوربین...');
            
            try {
                // روش ساده و استاندارد
                const constraints = { video: { facingMode: 'environment' } };
                cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                cameraVideo.srcObject = cameraStream;
                
                setStatus('✅ دوربین فعال شد - برای تست روی صفحه کلیک کنید');
                return true;
                
            } catch(err) {
                setStatus('❌ خطا: ' + err.message, true);
                console.error(err);
                return false;
            }
        }
        
        function playVideo() {
            if (isPlaying) return;
            isPlaying = true;
            overlayVideo.style.display = 'block';
            overlayVideo.currentTime = 0;
            overlayVideo.play();
            setStatus('🎉 ویدئو در حال پخش');
            
            setTimeout(() => {
                if (!overlayVideo.paused) {
                    overlayVideo.pause();
                    overlayVideo.style.display = 'none';
                    isPlaying = false;
                    setStatus('👋 ویدئو تمام شد - دوباره کلیک کنید');
                }
            }, 5000);
        }
        
        startBtn.onclick = async function() {
            startScreen.classList.add('hidden');
            const cameraOk = await startCamera();
            
            if (cameraOk) {
                setStatus('🎯 برای پخش ویدئو، روی صفحه کلیک کنید');
                document.body.onclick = playVideo;
            }
        };
        
        // ثبت Service Worker برای PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/raavi-ar/sw.js')
                .then(reg => console.log('Service Worker registered:', reg))
                .catch(err => console.log('Service Worker error:', err));
        }
        
        setStatus('✅ آماده - دکمه را بزنید');
    </script>
</body>
</html>
