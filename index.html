<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>RAAVI AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#667eea">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
    }

    #startBtn {
      padding: 15px 35px;
      border: none;
      border-radius: 30px;
      background: #667eea;
      color: white;
      font-size: 18px;
      font-weight: bold;
      margin-top: 25px;
    }

    #status {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      z-index: 999;
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div id="startScreen">
  <div style="font-size:70px;">🎯</div>
  <h1>RAAVI واقعیت افزوده</h1>
  <p>برای شروع، اجازه دسترسی به دوربین را بدهید.</p>
  <button id="startBtn">شروع تجربه AR</button>
</div>

<div id="status">آماده برای شروع</div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: false;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded
>
  <a-assets>
    <video
      id="arVideo"
      src="Raavi_AR-final2.webm"
      preload="auto"
      loop
      muted
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-video
      id="videoPlane"
      src="#arVideo"
      width="1"
      height="0.5625"
      position="0 0 0">
    </a-video>
  </a-entity>
</a-scene>

<script>
  const startScreen = document.getElementById("startScreen");
  const startBtn = document.getElementById("startBtn");
  const statusDiv = document.getElementById("status");
  const sceneEl = document.querySelector("a-scene");
  const video = document.getElementById("arVideo");
  const target = document.getElementById("target");

  function setStatus(text) {
    statusDiv.textContent = text;
  }

  startBtn.addEventListener("click", async () => {
    if (!window.isSecureContext) {
      setStatus("خطا: سایت باید با HTTPS باز شود.");
      return;
    }

    try {
      await video.play();
      video.pause();

      await sceneEl.systems["mindar-image-system"].start();

      startScreen.classList.add("hidden");
      setStatus("دوربین را به سمت تصویر هدف بگیرید");
    } catch (err) {
      console.error(err);
      setStatus("خطا در اجرای AR یا دسترسی دوربین");
    }
  });

  target.addEventListener("targetFound", async () => {
    setStatus("تصویر شناسایی شد");
    try {
      video.currentTime = 0;
      await video.play();
    } catch (err) {
      console.error(err);
    }
  });

  target.addEventListener("targetLost", () => {
    setStatus("تصویر از دید دوربین خارج شد");
    video.pause();
  });

  video.addEventListener("loadedmetadata", () => {
    const ratio = video.videoHeight / video.videoWidth;
    document.getElementById("videoPlane").setAttribute("height", ratio);
  });

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(console.log);
  }
</script>

</body>
</html>
