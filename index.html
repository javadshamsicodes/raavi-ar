<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>RAAVI AR</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#667eea">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
    }

    #startBtn {
      margin-top: 25px;
      padding: 15px 35px;
      border: none;
      border-radius: 30px;
      background: #667eea;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      z-index: 999;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div id="startScreen">
  <h1>🎯 RAAVI AR</h1>
  <p>برای شروع روی دکمه زیر کلیک کنید</p>
  <button id="startBtn">شروع تجربه AR</button>
</div>

<div id="status">آماده برای شروع...</div>

<a-scene
  id="scene"
  mindar-image="imageTargetSrc: targets.mind; autoStart: false;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded
>
  <a-assets>
    <video
      id="arVideo"
      src="Raavi_AR-final2.webm"
      preload="auto"
      loop
      muted
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex:0">
    <a-video
      id="videoPlane"
      src="#arVideo"
      width="1"
      height="0.5625"
      position="0 0 0">
    </a-video>
  </a-entity>

</a-scene>

<script>

const startBtn = document.getElementById("startBtn");
const startScreen = document.getElementById("startScreen");
const statusBox = document.getElementById("status");
const sceneEl = document.getElementById("scene");
const videoEl = document.getElementById("arVideo");
const targetEl = document.getElementById("target");

function setStatus(text){
  statusBox.innerHTML = text;
  console.log(text);
}

startBtn.addEventListener("click", async () => {

  setStatus("در حال راه‌اندازی AR ...");

  if (!window.isSecureContext) {
    setStatus("❌ سایت باید با HTTPS باز شود");
    return;
  }

  try {

    await videoEl.play();
    videoEl.pause();

    const mindarSystem =
      sceneEl.systems["mindar-image-system"];

    if (!mindarSystem) {
      setStatus("❌ MindAR بارگذاری نشد");
      return;
    }

    await mindarSystem.start();

    startScreen.classList.add("hidden");

    setStatus("📷 دوربین را به سمت تصویر هدف بگیرید");

  } catch(error) {

    console.error(error);
    setStatus("❌ " + error.message);

  }

});

targetEl.addEventListener("targetFound", async () => {

  setStatus("✅ تصویر شناسایی شد");

  try {

    videoEl.currentTime = 0;
    await videoEl.play();

  } catch(error) {

    console.error(error);

  }

});

targetEl.addEventListener("targetLost", () => {

  setStatus("📷 تصویر از دید دوربین خارج شد");
  videoEl.pause();

});

videoEl.addEventListener("loadedmetadata", () => {

  const ratio =
    videoEl.videoHeight / videoEl.videoWidth;

  document
    .getElementById("videoPlane")
    .setAttribute("height", ratio);

});

if ("serviceWorker" in navigator) {

  navigator.serviceWorker
    .register("sw.js")
    .catch(console.error);

}

</script>

</body>
</html>
