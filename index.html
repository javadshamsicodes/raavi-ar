<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RAAVI AR Museum</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        h1 { color: white; font-size: 28px; margin: 20px; }
        p { color: #aaa; margin: 10px 20px; line-height: 1.5; }
        
        #startBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 20px;
            border-radius: 50px;
            margin: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        
        #status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            z-index: 100;
            font-family: monospace;
        }
        
        .error { color: #ff8888 !important; }
        .hidden { display: none !important; }
        
        video, canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #overlayVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 20;
            display: none;
            background: rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="startScreen">
        <div style="font-size: 80px;">🎯</div>
        <h1>RAAVI واقعیت افزوده</h1>
        <p>دوربین را به سمت نشانه بگیرید</p>
        <button id="startBtn">شروع تجربه AR</button>
        <p style="font-size: 12px; color: #666; margin-top: 20px;">پس از کلیک، اجازه دسترسی به دوربین را بدهید</p>
    </div>

    <div id="status">✅ آماده - دکمه را بزنید</div>

    <video id="camera" autoplay playsinline muted></video>
    <video id="overlayVideo" src="Raavi_AR-final2.webm" loop muted playsinline></video>

    <script>
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');
        const cameraVideo = document.getElementById('camera');
        const overlayVideo = document.getElementById('overlayVideo');
        
        let cameraStream = null;
        let isPlaying = false;
        
        function setStatus(msg, isError = false) {
            statusDiv.innerHTML = msg;
            statusDiv.style.color = isError ? '#ff8888' : '#88ff88';
            console.log(msg);
        }
        
        async function startCamera() {
            setStatus('📱 در حال راه‌اندازی دوربین پشت...');
            
            try {
                // گرفتن دوربین پشت
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                
                let backCamera = videoDevices.find(d => 
                    d.label.toLowerCase().includes('back') ||
                    d.label.toLowerCase().includes('rear') ||
                    d.label.toLowerCase().includes('environment')
                );
                
                const constraints = backCamera 
                    ? { video: { deviceId: { exact: backCamera.deviceId } } }
                    : { video: { facingMode: 'environment' } };
                
                cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                cameraVideo.srcObject = cameraStream;
                
                setStatus('✅ دوربین فعال شد - برای تست روی صفحه کلیک کنید');
                return true;
                
            } catch(err) {
                setStatus('❌ خطا: ' + err.message, true);
                return false;
            }
        }
        
        function playVideo() {
            if (isPlaying) return;
            isPlaying = true;
            overlayVideo.style.display = 'block';
            overlayVideo.currentTime = 0;
            overlayVideo.play();
            setStatus('🎉 ویدئو در حال پخش');
            
            setTimeout(() => {
                if (!overlayVideo.paused) {
                    overlayVideo.pause();
                    overlayVideo.style.display = 'none';
                    isPlaying = false;
                    setStatus('👋 ویدئو تمام شد - دوباره کلیک کنید');
                }
            }, 5000);
        }
        
        startBtn.onclick = async function() {
            startScreen.classList.add('hidden');
            const cameraOk = await startCamera();
            
            if (cameraOk) {
                setStatus('🎯 برای تست، روی صفحه کلیک کنید تا ویدئو پخش شود');
                document.body.onclick = playVideo;
            }
        };
        
        setStatus('✅ آماده - دکمه را بزنید');
    </script>
</body>
</html>
